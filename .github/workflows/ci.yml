name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests of the firmware core
        run: make -C firmware/host test
        env:
          ASAN_OPTIONS: detect_leaks=0
      - name: End-to-end tests against the simulated ZED-F9P and caster
        run: make -C firmware/host e2e
        env:
          ASAN_OPTIONS: detect_leaks=0

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32-s3, esp32dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d firmware -e ${{ matrix.board }}

  raspberry-pi-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
