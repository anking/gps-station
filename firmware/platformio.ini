; GPS base station firmware: a ZED-F9P on a UART, corrections to an NTRIP caster over WiFi.
;
;   pio run -e esp32-s3 -t upload
;
; The pins are the ESP32's end of the UART wiring, see readme.md.

[platformio]
default_envs = esp32-s3

[common]
platform = espressif32
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/web/index.html

[env:esp32-s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    -DGPS_UART_NUM=1
    -DGPS_TX_PIN=17
    -DGPS_RX_PIN=18
    -DRESET_BUTTON_PIN=0

[env:esp32dev]
extends = common
board = esp32dev
build_flags =
    -DGPS_UART_NUM=2
    -DGPS_TX_PIN=17
    -DGPS_RX_PIN=16
    -DRESET_BUTTON_PIN=0
