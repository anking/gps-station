; GPS base station firmware: a ZED-F9P on a UART, corrections to rovers and an NTRIP caster over WiFi.
;
;   pio run -e esp32-c3 -t upload
;
; The pins are the ESP32's end of the UART wiring, see readme.md.

[platformio]
default_envs = esp32-c3

[common]
; The same as SolarControlV2, whose updates are proven in the field. Pinned so a build can be repeated.
platform = espressif32@6.10.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/web/index.html
board_build.embed_files =
    src/web/leaflet/leaflet.js.gz
    src/web/leaflet/leaflet.css.gz

; The Super Mini. Pins 2, 8 and 9 decide how it starts, and 20 and 21 carry its start-up messages, so these avoid them.
; Many of these boards cannot hold WiFi at full power, so this caps it at 8.5 dBm, in units of 0.25 dBm. Raise it if the
; base is far from the router and this particular board copes.
[env:esp32-c3]
extends = common
board = esp32-c3-devkitm-1
build_flags =
    -DGPS_UART_NUM=1
    -DGPS_TX_PIN=5
    -DGPS_RX_PIN=6
    -DRESET_BUTTON_PIN=9
    -DWIFI_MAX_TX_POWER=34

[env:esp32-s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    -DGPS_UART_NUM=1
    -DGPS_TX_PIN=17
    -DGPS_RX_PIN=18
    -DRESET_BUTTON_PIN=0

[env:esp32dev]
extends = common
board = esp32dev
build_flags =
    -DGPS_UART_NUM=2
    -DGPS_TX_PIN=17
    -DGPS_RX_PIN=16
    -DRESET_BUTTON_PIN=0
